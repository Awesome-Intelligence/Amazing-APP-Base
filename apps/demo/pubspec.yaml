name: demo
description: 待办助手示例 app（Flutter 版），演示 skill + agent + 流式 + 审批闸门 + membership 额度。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0

resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  kit:
    path: ../../kit
  kit_agent:
    path: ../../kit-agent
  kit_membership:
    path: ../../kit-membership
  # "立即更新"要打开下载页/商店。kit 不碰平台跳转（和 KMP 版同一条边界），
  # 所以这个能力由 app 自己引 —— 换成 in_app_update 也只改 update_gate.dart。
  url_launcher: ^6.3.0
  # 检查更新的"上次检查时间"要落盘（否则每次冷启动都白等一次网络）。
  # Web 没有文件系统，走条件导入换成内存实现，见 update_state_store_factory.dart。
  path_provider: ^2.1.5
  # material.dart 在 Flutter 3.47 起废弃，官方拆到独立包；kit 走这条路，
  # app 侧也必须一致 —— 两套 Theme/MaterialApp 类型不互通。
  material_ui: ^1.11.0
  # update_gate.dart 要自己建 HttpClient（超时/代理归 app 管，kit 不写平台接口）
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
