name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string
      is_prerelease:
        description: 'Pre-release'
        required: false
        type: boolean
        default: false

  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

# 默认只读；release job 要发 GitHub Release，单独提权到 write
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'
  JAVA_VERSION: '17'

jobs:
  android:
    name: Release (Android APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bootstrap
        run: bash scripts/ci.sh bootstrap

      # 签名配置写在 apps/demo/android/app/build.gradle.kts（读 key.properties）。
      # 这个 job 需要仓库里配好 4 个 secret：
      #   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # 没配就当场失败 —— 别等编完 4 分钟才报错。
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secret KEYSTORE_BASE64 没配，release 无法签名"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > apps/demo/android/app/release.keystore
          [ -s apps/demo/android/app/release.keystore ] || { echo "::error::keystore 解码后是空的"; exit 1; }

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > apps/demo/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/release.keystore
          EOF

      - name: Build APK
        env:
          VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          cd apps/demo
          flutter build apk --release \
            --build-name="${VERSION_NAME#v}" \
            --build-number="${{ github.run_number }}"

      - name: Rename APK
        env:
          VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}
        run: mv apps/demo/build/app/outputs/flutter-apk/app-release.apk \
               "apps/demo/build/app/outputs/flutter-apk/Android-Kit-$VERSION_NAME.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apps/demo/build/app/outputs/flutter-apk/Android-Kit-*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          draft: true
          prerelease: ${{ github.event.inputs.is_prerelease || 'false' }}
          files: apps/demo/build/app/outputs/flutter-apk/Android-Kit-*.apk
          generate_release_notes: true

  web:
    name: Release (Web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: bash scripts/ci.sh bootstrap
      - name: Build web
        run: cd apps/demo && flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: demo-web
          path: apps/demo/build/web
          retention-days: 30

  desktop-linux:
    name: Release (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build linux
        run: |
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev
          cd apps/demo && flutter build linux --release
      - name: Archive
        run: |
          cd apps/demo/build/linux/x64/release
          tar czf "$GITHUB_WORKSPACE/demo-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: demo-linux
          path: demo-linux-x64.tar.gz
          retention-days: 30

  desktop-macos:
    name: Release (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build macOS
        run: cd apps/demo && flutter build macos --release
      - name: Archive
        run: |
          cd apps/demo/build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent demo.app "$GITHUB_WORKSPACE/demo-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-macos
          path: demo-macos.zip
          retention-days: 30

  ios:
    name: Release (iOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # 出的是 unsigned 的 .app 构建产物；签名/上架要走正式的证书与 provisioning profile，
      # 在 fork 自己的 workflow 里配 —— 这里的产物只证明 iOS 目标编得过。
      - name: Build iOS (no codesign)
        run: cd apps/demo && flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: apps/demo/build/ios/iphoneos/Runner.app
          retention-days: 30
