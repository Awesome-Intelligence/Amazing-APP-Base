# 门禁的**逻辑**在 scripts/ci.sh，这里只负责「在什么环境跑哪道门禁」。
#
# 为什么不把命令写在这份 YAML 里：fork 要加自己的门禁时改 YAML 就等于改底座
# （跟上游冲突）。把逻辑留在 scripts/ 里，fork 只加一个 scripts/checks/xxx.sh 就行。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 关掉 Flutter 的首次启动分析上报，CI 上省几秒
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  verify:
    name: Verify (scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 子模块（skills/ 下的两个上游镜像）必须初始化 —— verify 那道门禁要检查目录非空
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # verify / contract 这两道不依赖 Flutter SDK —— 单独一个 job，
      # 契约或分层出问题时不用等三分钟的 SDK 安装
      - name: Contract + layers + secrets
        run: bash scripts/ci.sh verify
      - name: Mini-program contract
        run: bash scripts/ci.sh contract

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: bootstrap + analyze
        run: |
          bash scripts/ci.sh bootstrap
          bash scripts/ci.sh analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: bootstrap + test
        run: |
          bash scripts/ci.sh bootstrap
          bash scripts/ci.sh test

  backend:
    name: Backend (gateway)
    runs-on: ubuntu-latest
    # agent 网关（backend/）：tsc --noEmit + 冒烟检查。冒烟不花钱、不连网。
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: npm ci
        run: npm ci
        working-directory: backend
      - name: Type check + smoke
        run: bash scripts/ci.sh backend

  build:
    name: Build (web + android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: bootstrap
        run: bash scripts/ci.sh bootstrap
      - name: Build
        run: bash scripts/ci.sh build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: demo-web
          path: apps/demo/build/web
          retention-days: 7
      - name: Upload debug apk
        uses: actions/upload-artifact@v4
        with:
          name: demo-apk
          path: apps/demo/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: ignore

# 底座保护（fork 不许改底座）**不在这里**：
# 它在 .github/workflows/base-guard.yml，用 pull_request_target 触发 ——
# workflow 永远取 base 分支的版本，fork 改不动它。
# 这里再写一份会有两个问题：上游自己改底座的 PR 会误报红；
# 而且 pull_request 跑的是 PR 的代码，fork 改一下检查脚本就能把自己放过去。
